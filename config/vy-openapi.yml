    ListInvoicesResponse:
      description: RequestSuccess
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ListInvoicesResponse"
    GetProductConsumptionResponse:
      description: The response from the get product consumption action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GetProductConsumptionResponse"
    SubmitCloudUsageResponse:
      description: RequestSuccess
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubmitCloudUsageResponse"
  parameters: {}
  schemas:
    ValidationErrorResponse:
      type: object
      properties:
        type:
          type: string
          enum:
            - invalid_request_error
        code:
          type: string
          description: Specific machine-readable error code
        message:
          type: string
          description: Human-readable error explanation
        param:
          type: string
          description: Single parameter that failed validation
        params:
          type: array
          items:
            type: object
            properties:
              param:
                type: string
                description: The parameter that failed validation
              message:
                type: string
                description: Why validation failed for this parameter
            required:
              - param
              - message
          description: Multiple parameters that failed validation
      required:
        - type
        - code
        - message
    UnauthorizedErrorResponse:
      type: object
      properties:
        type:
          type: string
          enum:
            - authentication_error
        code:
          type: string
          enum:
            - authentication_failed
        message:
          type: string
          description: Human-readable error explanation
      required:
        - type
        - code
        - message
    RateLimitErrorResponse:
      type: object
      properties:
        type:
          type: string
          enum:
            - rate_limit_error
        code:
          type: string
          enum:
            - rate_limit_exceeded
        message:
          type: string
          description: Human-readable error explanation
      required:
        - type
        - code
        - message
    InternalServerErrorResponse:
      type: object
      properties:
        type:
          type: string
          enum:
            - api_error
        code:
          type: string
          enum:
            - internal_error
        message:
          type: string
          description: Human-readable error explanation
      required:
        - type
        - code
        - message
    NotFoundErrorResponse:
      type: object
      properties:
        type:
          type: string
          enum:
            - invalid_request_error
        code:
          type: string
          enum:
            - resource_not_found
        message:
          type: string
          description: Human-readable error explanation
      required:
        - type
        - code
        - message
    RequestTooLongErrorResponse:
      type: object
      properties:
        type:
          type: string
          enum:
            - invalid_request_error
        code:
          type: string
          enum:
            - request_too_large
        message:
          type: string
          description: Human-readable error explanation
      required:
        - type
        - code
        - message
    ConflictErrorResponse:
      type: object
      properties:
        type:
          type: string
          enum:
            - invalid_request_error
        code:
          type: string
          enum:
            - resource_already_exists
        message:
          type: string
          description: Human-readable error explanation
      required:
        - type
        - code
        - message
    CreateCatalogProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: The name of the catalog product
        description:
          type: string
          description: The description of the catalog product
        externalId:
          type: string
          description: The external ID of the catalog product
      required:
        - name
    CreateCatalogProductResponse:
      type: object
      properties:
        catalogProduct:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              description: The name of the catalog product
            description:
              type: string
              description: The description of the catalog product
            externalId:
              type: string
              description: The external ID of the catalog product
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required:
            - name
            - id
            - createdAt
            - updatedAt
      required:
        - catalogProduct
    ListCatalogProductsResponse:
      type: object
      properties:
        catalogProducts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                description: The name of the catalog product
              description:
                type: string
                description: The description of the catalog product
              externalId:
                type: string
                description: The external ID of the catalog product
              id:
                type: string
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
            required:
              - name
              - id
              - createdAt
              - updatedAt
        total:
          type: number
        hasMore:
          type: boolean
        nextCursor:
          type: string
      required:
        - catalogProducts
        - total
        - hasMore
    GetCatalogProductResponse:
      type: object
      properties:
        catalogProduct:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              description: The name of the catalog product
            description:
              type: string
              description: The description of the catalog product
            externalId:
              type: string
              description: The external ID of the catalog product
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required:
            - name
            - id
            - createdAt
            - updatedAt
      required:
        - catalogProduct
    UpdateCatalogProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: The name of the catalog product
        description:
          type: string
          description: The description of the catalog product
        externalId:
          type: string
          description: The external ID of the catalog product
      additionalProperties: false
    UpdateCatalogProductResponse:
      type: object
      properties:
        catalogProduct:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              description: The name of the catalog product
            description:
              type: string
              description: The description of the catalog product
            externalId:
              type: string
              description: The external ID of the catalog product
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required:
            - name
            - id
            - createdAt
            - updatedAt
      required:
        - catalogProduct
    DeleteCatalogProductResponse:
      type: object
      properties:
        catalogProduct:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              description: The name of the catalog product
            description:
              type: string
              description: The description of the catalog product
            externalId:
              type: string
              description: The external ID of the catalog product
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            deletedAt:
              type: string
          required:
            - name
            - id
            - createdAt
            - updatedAt
            - deletedAt
      required:
        - catalogProduct
    Contact:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          pattern: ^(?!\.)[A-Za-z0-9_!#$%&'*+/=?^`{|}~-]+(?:\.[A-Za-z0-9_!#$%&'*+/=?^`{|}~-]+)*@([A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,}$
        title:
          type: string
        phone:
          type: string
          pattern: ^\+?[1-9]\d{4,15}$
        receiveInvoiceEmail:
          type: boolean
    CustomerSource:
      type: string
      nullable: true
      enum:
        - Stripe
        - VayuEventsApi
        - Api
        - Salesforce
        - HubSpot
        - ContractExtraction
      description: The source of the customer
    CustomerCloudProviderSettings:
      type: object
      nullable: true
      properties:
        cloudProvider:
          type: string
          enum:
            - AWS
        cloudProviderMarketplaceId:
          type: string
        customerIdentifier:
          type: string
      description: Cloud provider settings for the customer
    Address:
      type: object
      nullable: true
      properties:
        country:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        addressText:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
      description: The address of the customer
    CustomerExternalIntegration:
      type: object
      properties:
        type:
          type: string
          enum:
            - NetSuite
            - QuickBooks
            - Morning
            - Hubspot
            - Anrok
            - Snowflake
            - Connact
            - Xero
            - Salesforce
            - Paddle
        id:
          type: string
        name:
          type: string
      required:
        - type
        - id
        - name
    Currency:
      type: string
      nullable: true
      enum:
        - USD
        - EUR
        - GBP
        - ILS
        - CAD
        - AUD
        - COP
        - BRL
        - ARS
        - INR
        - MXN
      description: The billing currency of the customer
    IntegrationEntityTypes:
      type: string
      enum:
        - Account
        - Invoice
        - SalesOrder
        - Item
        - Deal
        - Company
        - Opportunity
      description: The entity type in the integration (e.g., "Opportunity", "Deal")
    CustomFieldValueTypes:
      type: string
      enum:
        - String
        - Number
        - Boolean
        - Enum
