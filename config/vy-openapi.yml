                    description: The id of the product in NetSuite ERP
                  nsClass:
                    type: string
                    nullable: true
                    description: The class of the product in NetSuite ERP
                  nsClassId:
                    type: string
                    nullable: true
                    description: The id of the class of the product in NetSuite ERP
                  externalIntegrations:
                    type: array
                    nullable: true
                    items:
                      $ref: "#/components/schemas/ProductExternalIntegration"
                    description: Links the product to matching products in V3 integrations (e.g.
                      Paddle). For each entry, the product is linked to that
                      external integration after the contract is created, so
                      invoices for this product are exported to it. At most one
                      entry per provider. Currently only Paddle is supported.
                  commitment:
                    type: object
                    nullable: true
                    properties:
                      units:
                        type: number
                        minimum: 0
                        description: Units to commit the customer for
                      price:
                        type: number
                        nullable: true
                        minimum: 0
                        description: Price to charge the customer for the committed units
                      type:
                        type: string
                        enum:
                          - PRICE
                          - UNITS
                        default: UNITS
                        description: The type of commitment. UNITS means the commitment amount is in
                          units, PRICE means it is a monetary value. Defaults to
                          UNITS.
                      scheduling:
                        type: object
                        nullable: true
                        properties:
                          billingDay:
                            type: integer
                            minimum: 1
                            maximum: 31
                            default: 1
                            description: The day of the month for the commitment scheduling
                          duration:
                            type: object
                            properties:
                              unit:
                                type: string
                                enum:
                                  - DAY
                                  - WEEK
                                  - MONTH
                                  - YEAR
                                default: MONTH
                              value:
                                type: integer
                                minimum: 0
                                maximum: 1000
                            required:
                              - unit
                              - value
                            description: The duration of the commitment scheduling cycle. Unit must be MONTH
                              or YEAR.
                        required:
                          - duration
                        description: Scheduling for recurring commitment. Duration unit must be MONTH or
                          YEAR.
                      overageStrategy:
                        $ref: "#/components/schemas/ExternalOverageStrategy"
                    required:
                      - units
                    description: The commitment of the product
                  paymentTerm:
                    $ref: "#/components/schemas/PaymentTerm"
                  isCalendarAligned:
                    type: boolean
                    description: Whether the invoicing period should be calendar aligned. If not
                      provided, it will default to false. ONE_TIME and
                      COMMERCIAL_TERMS pricing models cannot be calendar
                      aligned. This field is ignored if the product is part of a
                      ProductGroup.
                  cloudProviderSettings:
                    $ref: "#/components/schemas/ProductCloudProviderSettings"
                  consumesCreditProductIds:
                    type: array
                    nullable: true
                    items:
                      type: string
                      pattern: ^[0-9a-fA-F]{24}$
                    description: IDs of credit products whose pools are drawn down when this usage
                      product is invoiced. Each ID matches the creditProductId
                      of a credit grant on the same contract that funds the
                      pool. Pools are drawn in the order listed. If omitted, no
                      credits are applied and the product is billed at full
                      price. Not supported inside productGroups.
                required:
                  - displayName
                  - scheduling
                  - pricing
              description: The products that the contract is associated with
            creditGrants:
              type: array
              nullable: true
              items:
                $ref: "#/components/schemas/ExternalCreditGrant"
              description: Credit grants that fund credit pools for the customer under this
                contract. Each grant credits a pool identified by its
                creditProductId; usage products draw down those pools via
                consumesCreditProductIds.
            productGroups:
              type: array
              items:
                $ref: "#/components/schemas/ProductGroup"
              description: Product groups are list of products that can be grouped as a single
                line item with shared settings like ERP settings, commitment
                settings, etc.
            accountManager:
              type: string
              nullable: true
              description: The name of the account manager of the contract
            shouldProRateInvoices:
              type: boolean
              description: Whether to pro rate the invoices for the contract. If not provided,
                it will default to false
              deprecated: true
            autoRenewContract:
              type: boolean
              description: Whether the contract is set to auto renew. If not provided, it will
                be treated as true
            customFields:
              type: array
              nullable: true
              items:
                $ref: "#/components/schemas/CustomField"
              description: Custom fields from CRM systems (Salesforce, HubSpot, etc.)
            customFieldValues:
              type: array
              nullable: true
              items:
                $ref: "#/components/schemas/CustomFieldValue"
              description: The stored custom field values associated with the contract
            status:
              $ref: "#/components/schemas/ContractStatus"
            purchaseOrder:
              type: string
              description: The purchase order number of the contract
            currency:
              allOf:
                - $ref: "#/components/schemas/Currency"
                - description: The currency of the contract. Overrides the customer-level currency
                    for all invoices under this contract. If not provided, the
                    customer currency or account default (USD) is used.
            isTrial:
              type: boolean
              description: "Whether the contract is a trial. All invoices under a trial
                contract are flagged with isTrial: true. If not provided, it
                defaults to false."
            externalId:
              type: string
              nullable: true
              description: A caller-owned external id for the contract. Once set, the contract
                can be fetched or deleted by passing this value in place of the
                Vayu id on the /contracts/{contractId} endpoints.
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required:
            - startDate
            - customerId
            - id
            - createdAt
            - updatedAt
      required:
        - contract
