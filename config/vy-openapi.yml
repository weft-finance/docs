                description: The id of the contract that the invoice is associated with
              name:
                type: string
                minLength: 1
                description: The name of the invoice, usually a description of the billing
                  period
              billingCycle:
                $ref: "#/components/schemas/FullDayPeriod"
              revenueBreakdown:
                type: object
                properties:
                  total:
                    type: number
                  subtotal:
                    type: number
                  overage:
                    type: number
                  discount:
                    type: number
                  creditsUsed:
                    type: number
                  tax:
                    type: number
                required:
                  - total
                  - subtotal
                  - overage
                  - discount
                  - creditsUsed
                  - tax
                description: The breakdown of the revenue for the invoice
              billingStatus:
                $ref: "#/components/schemas/InvoiceBillingStatus"
              paymentInfo:
                $ref: "#/components/schemas/PaymentInfo"
              dueDate:
                type: string
                nullable: true
                description: The due date of the invoice
                format: date-time
              accountId:
                type: string
                description: The id of the account that the invoice is associated with
              lineItems:
                type: array
                items:
                  $ref: "#/components/schemas/LineItem"
              amount:
                type: number
                description: The total amount of the invoice
              isTrial:
                type: boolean
                description: Whether the invoice belongs to a trial contract
              id:
                type: string
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
            required:
              - customerId
              - name
              - billingCycle
              - revenueBreakdown
              - billingStatus
              - dueDate
              - accountId
              - lineItems
              - amount
              - isTrial
              - id
              - createdAt
              - updatedAt
        total:
          type: number
        hasMore:
          type: boolean
        nextCursor:
          type: string
      required:
        - invoices
        - total
        - hasMore
    GetProductConsumptionResponse:
      type: object
      properties:
        productConsumption:
          allOf:
            - $ref: "#/components/schemas/ProductConsumption"
            - description: The product consumption data
      required:
        - productConsumption
    UsageWindow:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: The start timestamp of the usage window in ISO 8601 format
        end:
          type: string
          format: date-time
          description: The end timestamp of the usage window in ISO 8601 format
      required:
        - start
        - end
      description: The time window for which the usage was submitted
    PartnerSubmissionDetail:
      type: object
      properties:
        receivedAt:
          type: string
          description: The timestamp when the submission was received by the partner
        status:
          type: string
          enum:
            - SUCCESS
            - ERROR
          description: The status of the partner submission
        error:
          nullable: true
          description: Error details if the submission failed, null otherwise
      required:
        - receivedAt
        - status
    CloudUsageResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - ACCEPTED
            - REJECTED
          description: The status of the cloud usage submission result
        errorCode:
          type: string
          description: Error code if the submission was rejected
        usageWindow:
          $ref: "#/components/schemas/UsageWindow"
        errorMessage:
          type: string
          description: Detailed error message if the submission was rejected
        correlationId:
          type: string
          description: Unique identifier for tracing the submission through the system
        idempotencyKey:
          type: string
          pattern: ^vayu-\S{24}-\S{24}-\S{24}-\S{24}-\d{13}$
          description: Key used to ensure the submission is processed exactly once
        meterDimension:
          type: string
          description: The dimension of the meter being reported (e.g., API_CALLS,
            STORAGE_GB)
        acceptedQuantity:
          type: number
          description: The quantity that was accepted by the cloud provider
        partnerSubmission:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PartnerSubmissionDetail"
          description: Details of submissions to partner systems, keyed by request ID
        quantitySubmitted:
          type: number
          description: The total quantity that was submitted
        timestampSubmitted:
          type: string
          format: date-time
          description: The timestamp when the usage was submitted
        awsCustomerIdentifier:
          type: string
          description: The AWS customer identifier associated with this usage
      required:
        - status
        - usageWindow
        - correlationId
        - idempotencyKey
        - meterDimension
        - acceptedQuantity
        - partnerSubmission
        - quantitySubmitted
        - timestampSubmitted
        - awsCustomerIdentifier
    SubmitCloudUsageRequest:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CloudUsageResult"
          description: Array of usage submission results from the cloud provider
        productCode:
          type: string
          description: The product code identifying the cloud marketplace product
      required:
        - results
        - productCode
    SubmitCloudUsageResponse:
      type: object
      properties: {}
