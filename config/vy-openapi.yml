info:
  title: Vayu API
  version: 1.0.0
  description: >-
    The Vayu API is a RESTful API that allows you to submit events for
    processing and storage & manage billing related entities.
              The API is secured using the Bearer Authentication scheme with JWT tokens.
              To obtain a JWT token, please contact Vayu at team@withvayu.com
  contact:
    email: dev@withvayu.com
    name: Vayu, Inc
    url: https://withvayu.com
openapi: 3.0.0
servers:
  - url: https://connect.withvayu.com
    description: Production server
  - url: https://staging-connect.withvayu.com
    description: Sandbox server
tags:
  - name: auth
    description: The auth tag is used for endpoints related to authentication and
      authorization.
  - name: events
    description: The events tag is used for endpoints related to event ingestion.
  - name: customers
    description: The customers tag is used for endpoints related to customer management.
  - name: meters
    description: The meters tag is used for endpoints related to meter management.
  - name: contracts
    description: The contracts tag is used for endpoints related to contract management.
  - name: invoices
    description: The invoices tag is used for endpoints related to invoice management.
  - name: credits
    description: The credits tag is used for endpoints related to credit management.
  - name: webhooks
    description: The webhooks tag is used for endpoints related to webhook management.
components:
  securitySchemes:
    BearerAuthorizer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    CreateCatalogProductRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateCatalogProductRequest"
    UpdateCatalogProductRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateCatalogProductRequest"
    CreateCustomerRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateCustomerRequest"
    UpdateCustomerRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateCustomerRequest"
    UpdateMeterRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateMeterRequest"
    CreateContractRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateContractRequest"
    CreateMeasurementRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateMeasurementRequest"
    CreateCustomerRelationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateCustomerRelationRequest"
    CreateCustomFieldRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateCustomFieldRequest"
    UpdateCustomFieldRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateCustomFieldRequest"
    LoginRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginRequest"
    DeleteEventsByRefsRequest:
      required: true
      description: A list of event refs to delete. The request deletes the matching
        events for the authenticated account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeleteEventsByRefsRequest"
    EventsDryRunRequest:
      required: true
      description: >-
        An array of events following the EventInput schema. This request body
        should be included in the PUT request to '/events'
              Up to 1000 events or a total payload max size of 256KB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EventsDryRunRequest"
    SendEventsRequest:
      required: true
      description: >-
        An array of events following the EventInput schema. This request body
        should be included in the PUT request to '/events'
              Up to 1000 events or a total payload max size of 256KB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SendEventsRequest"
    V2DeleteEventsByRefsRequest:
      required: true
      description: A list of event refs to delete. The request deletes the matching
        events for the authenticated account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2DeleteEventsByRefsRequest"
    V2EventsDryRunRequest:
      required: true
      description: An array of events following the EventInput schema. Up to 1000
        events or a total payload max size of 256KB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2EventsDryRunRequest"
    V2SendEventsRequest:
      required: true
      description: An array of events following the EventInput schema. Up to 1000
        events or a total payload max size of 256KB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2SendEventsRequest"
    V2QueryEventsAggregationRequest:
      required: true
      description: Configuration for aggregating events by meters and time grouping.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2QueryEventsAggregationRequest"
    GrantCreditsRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GrantCreditsRequest"
    DeductCreditsRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeductCreditsRequest"
    CreditTopUpRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreditTopUpRequest"
    WebhookSubscribeRequest:
      required: true
      description: Subscribe to webhooks and receive event notifications.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebhookSubscribeRequest"
    TerminateContractRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TerminateContractRequest"
    RefreshContractCreditsRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefreshContractCreditsRequest"
    SubmitCloudUsageRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubmitCloudUsageRequest"
